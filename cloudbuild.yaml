steps:

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e  # Ensure the script exits on any error
    gcloud config set project gke-arena
    gcloud config set compute/zone asia-south1-a	
- name: 'gcr.io/cloud-builders/git'
  args: ['clone', 'https://github.com/asif0257/test-nginx.git', '.']
  dir: /app

  # Step 1: Build the Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/gke-arena/my-repo/nginx/nginx-sample:$SHORT_SHA', '.']

  # Step 2: Push the Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/gke-arena/my-repo/nginx/nginx-sample:$SHORT_SHA']

  # Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'nginx-sample'
    - '--image'
    - 'us-central1-docker.pkg.dev/gke-arena/my-repo/nginx/nginx-sample:$SHORT_SHA'
    - '--region'
    - 'asia-south1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--port'
    - '8080'

images:
  - 'us-central1-docker.pkg.dev/gke-arena/my-repo/nginx/nginx-sample:$SHORT_SHA'

